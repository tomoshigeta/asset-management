<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>② 不動産 — 資産可視化ダッシュボード</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<main>
  <h1>不動産</h1>
  <p class="page-sub">物件ごとの投資状況と月次収支。時価を入れた物件には含み損益と LTV が出ます。</p>

  <section>
    <div class="kpi-row" id="kpis"></div>
  </section>

  <section>
    <h2>物件別 投資構成</h2>
    <p class="sec-note">横軸は総投資額。棒の長さは物件間で比較できます。</p>
    <div class="card">
      <div class="bars" id="bars"></div>
      <div class="legend">
        <span><i class="swatch" style="background:var(--cat-equity)"></i>自己資金</span>
        <span><i class="swatch" style="background:var(--cat-repaid)"></i>累計返済額</span>
        <span><i class="swatch" style="background:var(--cat-debt)"></i>残債</span>
        <span><i class="swatch swatch-gain"></i>含み益</span>
        <span><i class="swatch swatch-loss"></i>含み損</span>
      </div>
    </div>
  </section>

  <section>
    <h2>月次収支</h2>
    <p class="sec-note">返済後収支 ＝ 家賃収入 − ローン返済 − 経費（管理費・修繕積立・固定資産税）。金額はすべて月額。</p>
    <div class="card table-wrap">
      <table id="cf">
        <caption>固定資産税は年額を12で割った平均月額です。保険料は含みません。</caption>
      </table>
    </div>
  </section>

  <section>
    <h2>物件詳細</h2>
    <p class="sec-note">行が物件、列が属性。物件が増えても縦に伸びます。</p>
    <div class="card table-wrap">
      <table id="detail"></table>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  const A = window.APP, D = A.D;
  document.getElementById("sidebar").innerHTML = A.sidebar("realestate.html");

  /* KPI */
  const kpis = [["総投資額", A.yen(A.RE.totalInvestment), "自己資金＋借入額"]];
  if (A.RE.valuedCount) {
    kpis.push(["時価合計",
      A.yen(A.RE.marketValue) + (A.RE.allValued ? "" :
        '<small style="display:block;font-size:11px;font-weight:400;color:var(--text-muted)">' +
        A.RE.valuedCount + " / " + A.D.realEstate.length + " 物件ぶん</small>"),
      "手入力の推定値"]);
  }
  if (A.RE.allValued) {
    kpis.push(["含み損益", A.plHTML(A.RE.pl), "時価合計 − 総投資額"]);
  }
  kpis.push(["残債合計", A.yen(A.RE.balance), "現在の返済残り"]);
  if (A.RE.ltv !== null) {
    kpis.push(["LTV", A.pct(A.RE.balance, A.RE.marketValue), "残債合計 ÷ 時価合計"]);
  }
  kpis.push(["返済進捗率", A.pct(A.RE.cumulativeRepaid, A.RE.principal), "累計返済額 ÷ 借入総額"]);
  document.getElementById("kpis").innerHTML = kpis.map(([l, v, sc]) =>
      '<div class="kpi"><div class="kpi-label">' + l + '</div>' +
      '<div class="kpi-scope">' + sc + '</div>' +
      '<div class="kpi-value num">' + v + '</div></div>'
    ).join("");

  /* 積み上げ横棒（全物件で同じスケール = 最大の総投資額） */
  const maxInv = Math.max.apply(null, D.realEstate.map(p => p.totalInvestment));
  /* 投資構成の棒と時価の棒を同じ縮尺にそろえる（片方だけ長く見えないように） */
  const maxScale = Math.max(maxInv,
    Math.max.apply(null, D.realEstate.map(p => p.marketValue || 0)));
  document.getElementById("bars").innerHTML = D.realEstate.map(p =>
    '<div class="bar-row">' +
      '<div class="bar-head">' +
        '<div class="bar-name">' + p.name + '<small>' + p.loan.lender + '</small></div>' +
        '<div class="bar-total num">' + A.yen(p.totalInvestment) +
          '<small>返済 ' + A.pct(p.loan.cumulativeRepaid, p.loan.principal) + '</small></div>' +
      '</div>' +
      A.stackedBar([
        { cls: "seg-equity", value: p.ownFunds,              label: p.name + " 自己資金" },
        { cls: "seg-repaid", value: p.loan.cumulativeRepaid, label: p.name + " 累計返済額" },
        { cls: "seg-debt",   value: p.loan.balance,          label: p.name + " 残債" }
      ], maxScale) +
      (A.equity(p)
        ? '<div class="bar-head" style="margin-top:8px">' +
            '<div class="bar-name" style="font-weight:400;color:var(--text-secondary)">時価' +
              (p.valuedAt || p.valuationBasis
                ? '<small>' + [p.valuationBasis, p.valuedAt ? p.valuedAt + " 時点" : null]
                    .filter(Boolean).join(" ／ ") + '</small>'
                : '') +
            '</div>' +
            '<div class="bar-total num">' + A.yen(p.marketValue) +
              '<small>' + A.plHTML(A.equity(p).pl) + '</small></div>' +
          '</div>' +
          A.plBar(p.totalInvestment, p.marketValue, maxScale, p.name + " 総投資額と時価")
        : '') +
    '</div>'
  ).join("");

  /* 月次収支テーブル */
  const cfRows = D.realEstate.map(p => {
    const c = A.cashflow(p);
    return '<tr><td>' + p.name + '</td>' +
      '<td class="n num">' + A.plain(c.rentIncome) + '</td>' +
      '<td class="n num">' + A.plain(c.repayment) + '</td>' +
      '<td class="n num">' + A.plain(c.managementFee) + '</td>' +
      '<td class="n num">' + A.plain(c.repairReserve) + '</td>' +
      '<td class="n num">' + A.plain(c.propertyTax) + '</td>' +
      '<td class="n">' + A.plHTML(c.net) + '</td></tr>';
  }).join("");
  document.getElementById("cf").innerHTML +=
    '<thead><tr><th>物件</th><th class="n">家賃収入</th><th class="n">ローン返済</th>' +
    '<th class="n">管理費</th><th class="n">修繕積立</th><th class="n">固定資産税</th>' +
    '<th class="n">返済後収支</th></tr></thead><tbody>' + cfRows +
    '<tr class="total-row"><td>合計</td>' +
      '<td class="n num">' + A.plain(A.CF_TOTAL.rentIncome) + '</td>' +
      '<td class="n num">' + A.plain(A.CF_TOTAL.repayment) + '</td>' +
      '<td class="n num" colspan="3" style="text-align:right">経費計 ' + A.plain(A.CF_TOTAL.expenses) + '</td>' +
      '<td class="n">' + A.plHTML(A.CF_TOTAL.net) + '</td></tr></tbody>';

  /* 物件詳細（行＝物件、列＝属性） */
  const anyValued = D.realEstate.some(p => A.equity(p));
  const cols = [
    ["住所",     p => p.address || "—"],
    ["広さ",     p => p.areaSqm.toFixed(1) + " m²", 1],
    ["階数",     p => p.floor || "—", 1],
    ["築年数",   p => p.ageYears + " 年", 1],
    ["金融機関", p => p.loan.lender],
    ["借入額",   p => A.plain(p.loan.principal), 1],
    ["期間",     p => A.fmtTerm(p.loan.termMonths), 1],
    ["金利",     p => p.loan.rate.toFixed(1) + " %", 1],
    ["残債",     p => A.plain(p.loan.balance), 1]
  ];
  if (anyValued) {
    cols.push(["時価", p => A.equity(p) ? A.plain(p.marketValue) : "—", 1]);
    cols.push(["含み損益", p => A.equity(p) ? A.plHTML(A.equity(p).pl) : "—", 1]);
    cols.push(["LTV", p => {
      const e = A.equity(p);
      return e && e.ltv !== null ? A.pct(p.loan.balance, p.marketValue) : "—";
    }, 1]);
  }
  document.getElementById("detail").innerHTML =
    '<thead><tr><th>物件</th>' +
      cols.map(c => '<th' + (c[2] ? ' class="n"' : '') + '>' + c[0] + '</th>').join("") +
    '</tr></thead><tbody>' +
    D.realEstate.map(p =>
      '<tr><td><b>' + p.name + '</b></td>' +
      cols.map(c => '<td' + (c[2] ? ' class="n num"' : '') + '>' + c[1](p) + '</td>').join("") +
      '</tr>'
    ).join("") + '</tbody>';

  A.foldNotes();
  A.initTooltip();
})();
</script>
</body>
</html>
